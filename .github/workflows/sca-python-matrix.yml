
name: Experimento SCA - Versoes Python

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca-python:
    name: Pip-Audit - Python ${{ matrix.python }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    env:
      VERSAO_PYTHON: ${{ matrix.python }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: Verificar versao
        run: python --version

      - name: Instalar Pip-Audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Executar analise SCA
        run: pip-audit -r requirements.txt
